<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6b4f">
  <title>Dinner plan</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Dinner plan</h1>
    <button id="settings-btn" class="ghost" aria-label="Settings">Settings</button>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <a href="#week" data-tab="week"><span>📅</span>Week</a>
    <a href="#recipes" data-tab="recipes"><span>📖</span>Recipes</a>
    <a href="#pantry" data-tab="pantry"><span>🧂</span>Pantry</a>
    <a href="#shopping" data-tab="shopping"><span>🛒</span>Shopping</a>
  </nav>
  <dialog id="dlg">
    <div class="dlg-head">
      <h2 id="dlg-title"></h2>
      <button class="ghost" id="dlg-close" aria-label="Close">✕</button>
    </div>
    <div id="dlg-body"></div>
  </dialog>
  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
